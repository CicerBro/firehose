# Host tuning for 10 Gbps speed tests (build plan §12.6).
# Install:  sudo cp 99-firehose.conf /etc/sysctl.d/ && sudo sysctl --system
# BBR needs the tcp_bbr module: echo tcp_bbr | sudo tee /etc/modules-load.d/bbr.conf && sudo modprobe tcp_bbr

# Fair-queue qdisc + BBR congestion control.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# Allow large socket buffers (256 MiB max) so a single stream can fill a
# high bandwidth-delay-product path.
net.core.rmem_max = 268435456
net.core.wmem_max = 268435456
net.ipv4.tcp_rmem = 4096 131072 268435456
net.ipv4.tcp_wmem = 4096 65536 268435456

# Deeper input queue for bursts at 10G.
net.core.netdev_max_backlog = 250000

# Recover from PMTU black holes; don't collapse cwnd between test requests.
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_slow_start_after_idle = 0
