# Traefik v3 static configuration for the speedtest (build plan §12.1).
# Mounted at /etc/traefik/traefik.yml by deploy/docker-compose.yml.
#
# Replace before use:
#   admin@example.com  -> your ACME account e-mail
#   provider: cloudflare -> your DNS provider (a wildcard cert REQUIRES the DNS-01 challenge)

global:
  checkNewVersion: false
  sendAnonymousUsage: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
      aliasHeadersStrategy: delete

  websecure:
    address: ":443"
    http:
      # Drop headers whose names alias managed ones (e.g. Remote_User for Remote-User).
      aliasHeadersStrategy: delete
    # Traefik is the edge: do NOT trust incoming X-Forwarded-* (no forwardedHeaders.trustedIPs).
    transport:
      respondingTimeouts:
        readTimeout: 90s   # v3 default is 60s; test requests are capped at 35s, but be explicit
        writeTimeout: 0s   # never cut off long downloads
        idleTimeout: 180s
    # NOTE: do NOT enable http3 on this entrypoint. Browser QUIC is CPU-bound and
    # would distort results; the test hosts must negotiate HTTP/1.1 over TCP.

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

certificatesResolvers:
  le:
    acme:
      email: admin@example.com
      storage: /acme/acme.json
      dnsChallenge:
        provider: cloudflare            # or your DNS provider; required for the wildcard
        resolvers:
          - "1.1.1.1:53"
          - "9.9.9.9:53"

log:
  level: INFO

# accessLog: optional. If you enable it, consider filtering to errors only:
# accessLog:
#   filters:
#     statusCodes: ["400-599"]
