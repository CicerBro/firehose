# Traefik v3 dynamic configuration for the speedtest (build plan §12.2).
# Requires Authelia >= 4.38 (the /api/authz/forward-auth endpoint).
#
# Replace before use:
#   speed.example.com   -> your speedtest domain (also in every s1..s8 host below)
#   127.0.0.1:9091      -> wherever your Authelia listens
#
# Gotchas (build plan §15):
#   - Test hosts use explicit Host() matchers, NOT HostRegexp: Traefik maps TLS
#     options to SNI via the router's Host() domains, so with HostRegexp the
#     http11only option would silently not apply (and HTTP/2 makes "multi" fake).
#   - Two routers for the same host MUST use the same TLS options; the bearer-token
#     routers below mirror the Authelia routers exactly.
#   - No compress, buffering or retry middleware anywhere.

http:
  middlewares:
    authelia:
      forwardAuth:
        address: "http://127.0.0.1:9091/api/authz/forward-auth"   # point at your Authelia
        trustForwardHeader: true
        maxResponseBodySize: 1048576   # Authelia's responses are tiny
        authResponseHeaders:
          - Remote-User
          - Remote-Groups
          - Remote-Email
          - Remote-Name

    # Bearer-token (CLI) routers skip Authelia, so make sure a client cannot
    # smuggle in its own Remote-User header. An empty value removes the header.
    strip-auth-headers:
      headers:
        customRequestHeaders:
          Remote-User: ""
          Remote-Groups: ""
          Remote-Email: ""
          Remote-Name: ""

  routers:
    # ---- Browser path: Authelia on every hostname ----
    speedtest-ui:
      rule: 'Host(`speed.example.com`)'
      entryPoints: [websecure]
      middlewares: [authelia]
      service: speedtest
      tls:
        certResolver: le
        domains:
          - main: "speed.example.com"
            sans: ["*.speed.example.com"]

    speedtest-test:
      rule: >-
        Host(`s1.speed.example.com`) || Host(`s2.speed.example.com`) ||
        Host(`s3.speed.example.com`) || Host(`s4.speed.example.com`) ||
        Host(`s5.speed.example.com`) || Host(`s6.speed.example.com`) ||
        Host(`s7.speed.example.com`) || Host(`s8.speed.example.com`)
      entryPoints: [websecure]
      middlewares: [authelia]
      service: speedtest
      tls:
        certResolver: le
        options: http11only
        domains:   # reuse the wildcard instead of issuing eight separate certs
          - main: "speed.example.com"
            sans: ["*.speed.example.com"]

    # ---- CLI path: "Authorization: Bearer" skips Authelia; the app validates the token ----
    speedtest-ui-token:
      rule: 'Host(`speed.example.com`) && HeaderRegexp(`Authorization`, `^Bearer .+`)'
      priority: 1000
      entryPoints: [websecure]
      middlewares: [strip-auth-headers]
      service: speedtest
      tls:
        certResolver: le
        domains:
          - main: "speed.example.com"
            sans: ["*.speed.example.com"]

    speedtest-test-token:
      rule: >-
        (Host(`s1.speed.example.com`) || Host(`s2.speed.example.com`) ||
        Host(`s3.speed.example.com`) || Host(`s4.speed.example.com`) ||
        Host(`s5.speed.example.com`) || Host(`s6.speed.example.com`) ||
        Host(`s7.speed.example.com`) || Host(`s8.speed.example.com`)) &&
        HeaderRegexp(`Authorization`, `^Bearer .+`)
      priority: 1000
      entryPoints: [websecure]
      middlewares: [strip-auth-headers]
      service: speedtest
      tls:
        certResolver: le
        options: http11only
        domains:
          - main: "speed.example.com"
            sans: ["*.speed.example.com"]

  services:
    speedtest:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://127.0.0.1:8080"   # SPEEDTEST_LISTEN
        # no buffering, no compress middleware, no retry middleware

tls:
  options:
    http11only:
      minVersion: VersionTLS12
      alpnProtocols:
        - http/1.1
      # If you ever switch to the TLS-ALPN-01 ACME challenge, add "acme-tls/1" here.
      # With DNS-01 (used here) it is not needed.
